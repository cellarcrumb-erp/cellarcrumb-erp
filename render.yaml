services:
  - type: web
    name: cellarcrumb-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:wsgi_app --workers 2 --timeout 120
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cellarcrumb-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: cellarcrumb-db
    plan: free
