{% extends 'base.html' %}
{% block title %}Record Production Wastage{% endblock %}
{% block content %}
<div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
  <div>
    <h1 class="page-title">Record Production Wastage</h1>
    <p class="page-subtitle">Log material or finished goods spoilage and adjust inventory</p>
  </div>
  <a href="{{ url_for('production.wastage_list') }}" class="btn btn-secondary">Back to Wastage List</a>
</div>

<div class="card" style="padding:24px; max-width:680px;">
  <form method="POST" action="{{ url_for('production.wastage_new') }}">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Date *</label>
        <input type="date" name="doc_date" value="{{ today }}" required class="form-control">
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Production Order (Optional)</label>
        <select name="production_order_id" class="form-control">
          <option value="">-- General Spoilage / None --</option>
          {% for o in orders %}
          <option value="{{ o.id }}">{{ o.doc_ref }} ({{ o.batch_no or 'No Batch' }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Item *</label>
        <select name="item_id" required class="form-control">
          <option value="">-- Select Item --</option>
          {% for i in items %}
          <option value="{{ i.id }}">{{ i.name }} ({{ i.code }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Deduct from Warehouse</label>
        <select name="warehouse_id" class="form-control">
          <option value="">-- Do Not Deduct Stock --</option>
          {% for w in warehouses %}
          <option value="{{ w.id }}" {% if loop.first %}selected{% endif %}>{{ w.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 2fr; gap:16px; margin-bottom:20px;">
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Wastage Quantity *</label>
        <input type="number" step="0.01" min="0.01" name="wastage_qty" required class="form-control" placeholder="0.00">
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; display:block; margin-bottom:6px;">Reason / Notes *</label>
        <input type="text" name="reason" required class="form-control" placeholder="e.g. Burnt batch, broken bottle, expired yeast">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Wastage Record</button>
  </form>
</div>
{% endblock %}
