<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cellar & Crumb Operations ERP</title>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-circle {
      width: 56px;
      height: 56px;
      background: #c9a84c;
      color: #0f172a;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(201, 168, 76, 0.3);
    }
    .logo-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .logo-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      transition: all 0.2s;
      outline: none;
    }
    .form-control:focus {
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.15);
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #c9a84c;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #b8973b;
    }
    .btn-login:active {
      transform: scale(0.99);
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
    }
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-container">
    <div class="logo-circle">C&C</div>
    <div class="logo-title">Cellar & Crumb</div>
    <div class="logo-subtitle">Sign in to your account</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert">
          <i data-feather="alert-circle" style="width:16px;height:16px;"></i>
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('auth.login') }}" method="POST">
    <div class="form-group">
      <div class="input-wrapper">
        <i data-feather="user"></i>
        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <div class="input-wrapper">
        <i data-feather="lock"></i>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
    </div>
    <button type="submit" class="btn-login">Sign In</button>
  </form>
  
  <div class="footer">
    &copy; 2026 Cellar & Crumb Operations. All rights reserved.
  </div>
</div>

<script>
  feather.replace();
</script>
</body>
</html>
