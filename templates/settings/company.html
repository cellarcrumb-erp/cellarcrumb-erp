{% extends 'base.html' %}
{% block page_title %}Company Profile{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('settings.index') }}">Settings</a>
  <span class="breadcrumb-sep">/</span>
  <span>Company Profile</span>
</div>
<div class="card form-card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Company Name *</label>
        <input type="text" name="name" class="form-control" value="{{ company.name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ company.phone }}">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ company.email }}">
      </div>
      <div class="form-group">
        <label class="form-label">Tax ID (KRA PIN)</label>
        <input type="text" name="tax_id" class="form-control" value="{{ company.tax_id }}">
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control">{{ company.address }}</textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
