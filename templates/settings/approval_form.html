{% extends 'base.html' %}
{% block page_title %}{% if workflow %}Edit{% else %}New{% endif %} Approval Rule{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('settings.index') }}">Settings</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('settings.approvals') }}">Approval Workflows</a>
  <span class="breadcrumb-sep">/</span>
  <span>{% if workflow %}Edit{% else %}New{% endif %}</span>
</div>
<div class="card form-card">
  <form method="POST" action="">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Module</label>
        <select name="module" class="form-control">
          <option value="Sales" {% if workflow and workflow.module=='Sales' %}selected{% endif %}>Sales</option>
          <option value="Purchases" {% if workflow and workflow.module=='Purchases' %}selected{% endif %}>Purchases</option>
          <option value="Production" {% if workflow and workflow.module=='Production' %}selected{% endif %}>Production</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Doc Type</label>
        <input type="text" name="doc_type" class="form-control" value="{{ workflow.doc_type if workflow else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Condition Field</label>
        <input type="text" name="condition_field" class="form-control" value="{{ workflow.condition_field if workflow else 'amount' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Operator</label>
        <select name="condition_op" class="form-control">
          <option value=">=" {% if workflow and workflow.condition_op=='>=' %}selected{% endif %}>>=</option>
          <option value=">" {% if workflow and workflow.condition_op=='>' %}selected{% endif %}>></option>
          <option value="<=" {% if workflow and workflow.condition_op=='<=' %}selected{% endif %}><=</option>
          <option value="<" {% if workflow and workflow.condition_op=='<' %}selected{% endif %}><</option>
          <option value="=" {% if workflow and workflow.condition_op=='=' %}selected{% endif %}>=</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Condition Value</label>
        <input type="number" step="0.01" name="condition_value" class="form-control" value="{{ workflow.condition_value if workflow else '0' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Approver Role *</label>
        <select name="approver_role_id" class="form-control" required>
          {% for r in roles %}
          <option value="{{ r.id }}" {% if workflow and workflow.approver_role_id == r.id %}selected{% endif %}>{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Is Active</label>
        <input type="checkbox" name="is_active" {% if not workflow or workflow.is_active %}checked{% endif %}>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
      <a href="{{ url_for('settings.approvals') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
