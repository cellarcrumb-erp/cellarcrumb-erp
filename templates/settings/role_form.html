{% extends 'base.html' %}
{% block page_title %}{% if role %}Edit{% else %}New{% endif %} Role{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('settings.index') }}">Settings</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('settings.roles') }}">Roles</a>
  <span class="breadcrumb-sep">/</span>
  <span>{% if role %}Edit{% else %}New{% endif %}</span>
</div>
<div class="card form-card">
  <form method="POST" action="">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" value="{{ role.name if role else '' }}" required>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ role.description if role else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
      <a href="{{ url_for('settings.roles') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
