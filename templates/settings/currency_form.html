{% extends 'base.html' %}
{% block page_title %}{% if currency %}Edit{% else %}New{% endif %} Currency{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('settings.index') }}">Settings</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('settings.currencies') }}">Currencies</a>
  <span class="breadcrumb-sep">/</span>
  <span>{% if currency %}Edit{% else %}New{% endif %}</span>
</div>
<div class="card form-card">
  <form method="POST" action="">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Code *</label>
        <input type="text" name="code" class="form-control" value="{{ currency.code if currency else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" value="{{ currency.name if currency else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Symbol</label>
        <input type="text" name="symbol" class="form-control" value="{{ currency.symbol if currency else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Exchange Rate *</label>
        <input type="number" step="0.000001" name="exchange_rate" class="form-control" value="{{ currency.exchange_rate if currency else '1.0' }}" required>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
      <a href="{{ url_for('settings.currencies') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
