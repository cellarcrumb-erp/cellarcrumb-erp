{% extends 'base.html' %}
{% block page_title %}{% if account %}Edit{% else %}New{% endif %} Account{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('banking.index') }}">Banking</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('banking.accounts') }}">Accounts</a>
  <span class="breadcrumb-sep">/</span>
  <span>{% if account %}Edit{% else %}New{% endif %}</span>
</div>
<div class="card form-card">
  <form method="POST" action="{{ action }}">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Code *</label>
        <input type="text" name="code" class="form-control" value="{{ account.code if account else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" value="{{ account.name if account else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Account Type</label>
        <select name="account_type" class="form-control">
          <option value="Bank" {% if account and account.account_type == 'Bank' %}selected{% endif %}>Bank</option>
          <option value="Cash" {% if account and account.account_type == 'Cash' %}selected{% endif %}>Cash</option>
          <option value="Mobile Money" {% if account and account.account_type == 'Mobile Money' %}selected{% endif %}>Mobile Money</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Bank Name</label>
        <input type="text" name="bank_name" class="form-control" value="{{ account.bank_name if account else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Account Number</label>
        <input type="text" name="account_number" class="form-control" value="{{ account.account_number if account else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Currency</label>
        <select name="currency_id" class="form-control">
          {% for c in currencies %}
          <option value="{{ c.id }}" {% if account and account.currency_id == c.id %}selected{% endif %}>{{ c.code }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">GL Account</label>
        <select name="coa_id" class="form-control">
          <option value="">None</option>
          {% for acc in coa_accounts %}
          <option value="{{ acc.id }}" {% if account and account.coa_id == acc.id %}selected{% endif %}>{{ acc.code }} - {{ acc.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% if not account %}
      <div class="form-group">
        <label class="form-label">Opening Balance</label>
        <input type="number" step="0.01" name="opening_balance" class="form-control" value="0.00">
      </div>
      {% endif %}
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
      <a href="{{ url_for('banking.accounts') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
