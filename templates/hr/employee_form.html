{% extends 'base.html' %}
{% block page_title %}{% if emp %}Edit{% else %}New{% endif %} Employee{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('hr.index') }}">HR</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('hr.employees') }}">Employees</a>
  <span class="breadcrumb-sep">/</span>
  <span>{% if emp %}Edit{% else %}New{% endif %}</span>
</div>
<form method="POST" action="{{ action }}">
  <div class="card form-card mb-4" style="margin-bottom:20px;">
    <div class="card-header"><div class="card-title">Personal Information</div></div>
    <div class="form-grid" style="padding:16px;">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="form-control" value="{{ emp.full_name if emp else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Employee No *</label>
        <input type="text" name="emp_no" class="form-control" value="{{ emp.emp_no if emp else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ emp.email if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ emp.phone if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ emp.address if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">National ID</label>
        <input type="text" name="national_id" class="form-control" value="{{ emp.national_id if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">KRA PIN</label>
        <input type="text" name="kra_pin" class="form-control" value="{{ emp.kra_pin if emp else '' }}">
      </div>
    </div>
  </div>
  <div class="card form-card mb-4" style="margin-bottom:20px;">
    <div class="card-header"><div class="card-title">Employment Details</div></div>
    <div class="form-grid" style="padding:16px;">
      <div class="form-group">
        <label class="form-label">Department *</label>
        <select name="department_id" class="form-control" required>
          {% for d in departments %}
          <option value="{{ d.id }}" {% if emp and emp.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Job Title *</label>
        <select name="job_title_id" class="form-control" required>
          {% for jt in job_titles %}
          <option value="{{ jt.id }}" {% if emp and emp.job_title_id == jt.id %}selected{% endif %}>{{ jt.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Employment Type *</label>
        <select name="employment_type" class="form-control" required>
          <option value="Full Time" {% if emp and emp.employment_type == 'Full Time' %}selected{% endif %}>Full Time</option>
          <option value="Part Time" {% if emp and emp.employment_type == 'Part Time' %}selected{% endif %}>Part Time</option>
          <option value="Contract" {% if emp and emp.employment_type == 'Contract' %}selected{% endif %}>Contract</option>
          <option value="Casual" {% if emp and emp.employment_type == 'Casual' %}selected{% endif %}>Casual</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date Hired</label>
        <input type="date" name="date_hired" class="form-control" value="{{ emp.date_hired if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Monthly Salary (KES)</label>
        <input type="number" step="0.01" name="monthly_salary" class="form-control" value="{{ emp.monthly_salary if emp else '0' }}">
      </div>
    </div>
  </div>
  <div class="card form-card mb-4" style="margin-bottom:20px;">
    <div class="card-header"><div class="card-title">Emergency Contact</div></div>
    <div class="form-grid" style="padding:16px;">
      <div class="form-group">
        <label class="form-label">Contact Name</label>
        <input type="text" name="emergency_contact" class="form-control" value="{{ emp.emergency_contact if emp else '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Contact Phone</label>
        <input type="text" name="emergency_phone" class="form-control" value="{{ emp.emergency_phone if emp else '' }}">
      </div>
    </div>
  </div>
  <div class="card form-card mb-4" style="margin-bottom:20px;">
    <div class="card-header"><div class="card-title">Notes</div></div>
    <div class="form-grid" style="padding:16px;">
      <div class="form-group" style="grid-column: 1 / -1;">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control">{{ emp.notes if emp else '' }}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="Active" {% if emp and emp.status == 'Active' %}selected{% endif %}>Active</option>
          <option value="On Leave" {% if emp and emp.status == 'On Leave' %}selected{% endif %}>On Leave</option>
          <option value="Inactive" {% if emp and emp.status == 'Inactive' %}selected{% endif %}>Inactive</option>
        </select>
      </div>
    </div>
  </div>
  <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
    <a href="{{ url_for('hr.employees') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
