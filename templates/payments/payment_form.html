{% extends 'base.html' %}
{% block page_title %}New {{ payment_type }} Payment{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('payments.index') }}">Payments</a>
  <span class="breadcrumb-sep">/</span>
  <span>New {{ payment_type }}</span>
</div>
<div class="card form-card">
  <form method="POST" action="">
    <div class="form-grid">
      {% if payment_type in ['Incoming', 'Outgoing'] %}
      <div class="form-group">
        <label class="form-label">Partner *</label>
        <select name="partner_id" class="form-control" required>
          {% for p in partners %}
          <option value="{{ p.id }}">{{ p.name }} ({{ p.code }})</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="form-group">
        <label class="form-label">Branch *</label>
        <select name="branch_id" class="form-control" required>
          {% for b in branches %}
          <option value="{{ b.id }}" {% if active_branch_id == b.id %}selected{% elif not active_branch_id and b.is_main %}selected{% endif %}>
            {{ b.name }} ({{ b.code }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" name="doc_date" class="form-control" required value="{{ today }}">
      </div>
      <div class="form-group">
        <label class="form-label">Amount *</label>
        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Payment Method *</label>
        <select name="payment_method_id" class="form-control" required>
          {% for m in payment_methods %}
          <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Bank Account *</label>
        <select name="bank_account_id" class="form-control" required>
          {% for a in bank_accounts %}
          <option value="{{ a.id }}">{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Reference</label>
        <input type="text" name="reference" class="form-control">
      </div>
      {% if payment_type == 'Expense' %}
      <div class="form-group">
        <label class="form-label">Expense Account *</label>
        <select name="expense_account_id" class="form-control" required>
          {% for a in expense_accounts %}
          <option value="{{ a.id }}">{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Description *</label>
        <input type="text" name="description" class="form-control" required>
      </div>
      {% endif %}
      <div class="form-group" style="grid-column: 1 / -1;">
        <label class="form-label">Remarks</label>
        <textarea name="remarks" class="form-control"></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; gap:10px;">
      <a href="{{ url_for('payments.index') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" name="action" value="draft" class="btn btn-secondary">Save as Draft</button>
      <button type="submit" name="action" value="post" class="btn btn-primary">Save & Post</button>
    </div>
  </form>
</div>
{% endblock %}
