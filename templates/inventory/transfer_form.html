{% extends "base.html" %}
{% block page_title %}New Stock Transfer{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">New Stock Transfer (ITR / ST)</h2>
        <p class="text-sm text-gray-500">Move inventory between warehouses</p>
    </div>
</div>

<form method="POST" class="bg-white rounded-lg shadow p-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                <a id="fromWhLink" href="#" target="_blank" class="sap-arrow" title="Open Source Warehouse Master Data" onclick="if(this.getAttribute('href')==='#'){alert('Select From Warehouse first.');return false;}">➜</a>
                From Warehouse *
            </label>
            <select name="from_warehouse_id" required class="w-full border rounded p-2 text-sm" onchange="const w=this.value; document.getElementById('fromWhLink').href=w?('/inventory/warehouses/'+w):'#';">
                <option value="">Source Warehouse</option>
                {% for w in warehouses %}
                <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                <a id="toWhLink" href="#" target="_blank" class="sap-arrow" title="Open Destination Warehouse Master Data" onclick="if(this.getAttribute('href')==='#'){alert('Select To Warehouse first.');return false;}">➜</a>
                To Warehouse *
            </label>
            <select name="to_warehouse_id" required class="w-full border rounded p-2 text-sm" onchange="const w=this.value; document.getElementById('toWhLink').href=w?('/inventory/warehouses/'+w):'#';">
                <option value="">Destination Warehouse</option>
                {% for w in warehouses %}
                <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Transfer Date *</label>
            <input type="date" name="doc_date" required class="w-full border rounded p-2 text-sm" value="{{ today }}">
        </div>
    </div>

    <h3 class="text-lg font-bold text-gray-800 mb-2">Transferred Items</h3>
    <div class="overflow-x-auto mb-4 border rounded">
        <table class="w-full text-left border-collapse" id="linesTable">
            <thead>
                <tr class="bg-gray-50 border-b text-xs text-gray-600 uppercase">
                    <th class="p-2 text-center" style="width:44px;">#</th>
                    <th class="p-2">Item Code *</th>
                    <th class="p-2">Item Description</th>
                    <th class="p-2 text-center">UOM</th>
                    <th class="p-2 text-right">Transfer Quantity *</th>
                    <th class="p-2 text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b line-row">
                    <td class="p-2 text-center text-xs font-bold line-num-cell">1</td>
                    <td class="p-2">
                        <div style="display:flex; align-items:center; gap:4px;">
                            <a href="#" target="_blank" class="sap-arrow item-master-link" title="Open Item Master Data" onclick="if(this.getAttribute('href')==='#'){alert('Select an Item first.');return false;}">➜</a>
                            <select name="item_id[]" required class="w-full border rounded p-1 text-sm item-select font-mono" onchange="itemSelected(this)">
                                <option value="">Select Code</option>
                                {% for i in items %}
                                <option value="{{ i.id }}" data-name="{{ i.name }}" data-uom="{{ i.uom_name or 'PCS' }}">{{ i.code }} — {{ i.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </td>
                    <td class="p-2 text-sm font-semibold item-desc-cell">-</td>
                    <td class="p-2 text-center text-xs font-bold text-gray-500 uom-cell">-</td>
                    <td class="p-2"><input type="number" step="0.01" name="quantity[]" required class="w-28 border rounded p-1 text-sm text-right qty-input" value="1"></td>
                    <td class="p-2 text-center">
                        <button type="button" class="text-red-500 hover:text-red-700 font-bold px-2 remove-btn" onclick="removeRow(this)">&times;</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex justify-between items-center mb-6">
        <button type="button" onclick="addRow()" class="btn btn-secondary text-sm">+ Add Row</button>
    </div>

    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
        <textarea name="remarks" rows="2" class="w-full border rounded p-2 text-sm"></textarea>
    </div>

    <div class="flex justify-end gap-2">
        <a href="{{ url_for('inventory.transfers') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Draft Transfer</button>
    </div>
</form>

<script>
function renumberRows() {
    document.querySelectorAll('#linesTable tbody tr').forEach((r, idx) => {
        const c = r.querySelector('.line-num-cell');
        if (c) c.innerText = idx + 1;
    });
}
function itemSelected(sel) {
    const uom = sel.selectedOptions[0]?.getAttribute('data-uom') || '-';
    const name = sel.selectedOptions[0]?.getAttribute('data-name') || '-';
    const row = sel.closest('tr');
    const uomCell = row.querySelector('.uom-cell');
    if (uomCell) uomCell.innerText = uom;
    const descCell = row.querySelector('.item-desc-cell');
    if (descCell) descCell.innerText = name;
    const link = row.querySelector('.item-master-link');
    if (link) link.href = sel.value ? (`/inventory/items/${sel.value}`) : '#';
}
function addRow() {
    const tbody = document.querySelector('#linesTable tbody');
    const tr = document.querySelector('.line-row').cloneNode(true);
    tr.querySelector('.item-select').value = '';
    const uomCell = tr.querySelector('.uom-cell');
    if (uomCell) uomCell.innerText = '-';
    const descCell = tr.querySelector('.item-desc-cell');
    if (descCell) descCell.innerText = '-';
    const link = tr.querySelector('.item-master-link');
    if (link) link.href = '#';
    tr.querySelector('.qty-input').value = 1;
    tbody.appendChild(tr);
    renumberRows();
}
function removeRow(btn) {
    if(document.querySelectorAll('.line-row').length > 1) {
        btn.closest('tr').remove();
        renumberRows();
    }
}
</script>
{% endblock %}
