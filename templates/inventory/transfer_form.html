{% extends "base.html" %}
{% block page_title %}New Stock Transfer{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">New Stock Transfer (ITR / ST)</h2>
        <p class="text-sm text-gray-500">Move inventory between warehouses</p>
    </div>
</div>

<form method="POST" class="bg-white rounded-lg shadow p-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">From Warehouse *</label>
            <select name="from_warehouse_id" required class="w-full border rounded p-2 text-sm">
                <option value="">Source Warehouse</option>
                {% for w in warehouses %}
                <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To Warehouse *</label>
            <select name="to_warehouse_id" required class="w-full border rounded p-2 text-sm">
                <option value="">Destination Warehouse</option>
                {% for w in warehouses %}
                <option value="{{ w.id }}">{{ w.name }} ({{ w.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Transfer Date *</label>
            <input type="date" name="doc_date" required class="w-full border rounded p-2 text-sm" value="{{ today }}">
        </div>
    </div>

    <h3 class="text-lg font-bold text-gray-800 mb-2">Transferred Items</h3>
    <div class="overflow-x-auto mb-4 border rounded">
        <table class="w-full text-left border-collapse" id="linesTable">
            <thead>
                <tr class="bg-gray-50 border-b text-xs text-gray-600 uppercase">
                    <th class="p-2">Item *</th>
                    <th class="p-2 text-right">Transfer Quantity *</th>
                    <th class="p-2 text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b line-row">
                    <td class="p-2">
                        <select name="item_id[]" required class="w-full border rounded p-1 text-sm item-select">
                            <option value="">Select Item</option>
                            {% for i in items %}
                            <option value="{{ i.id }}">{{ i.code }} - {{ i.name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td class="p-2"><input type="number" step="0.01" name="quantity[]" required class="w-28 border rounded p-1 text-sm text-right qty-input" value="1"></td>
                    <td class="p-2 text-center">
                        <button type="button" class="text-red-500 hover:text-red-700 font-bold px-2 remove-btn" onclick="removeRow(this)">&times;</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex justify-between items-center mb-6">
        <button type="button" onclick="addRow()" class="btn btn-secondary text-sm">+ Add Row</button>
    </div>

    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
        <textarea name="remarks" rows="2" class="w-full border rounded p-2 text-sm"></textarea>
    </div>

    <div class="flex justify-end gap-2">
        <a href="{{ url_for('inventory.transfers') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Draft Transfer</button>
    </div>
</form>

<script>
function addRow() {
    const tbody = document.querySelector('#linesTable tbody');
    const tr = document.querySelector('.line-row').cloneNode(true);
    tr.querySelector('.qty-input').value = 1;
    tbody.appendChild(tr);
}
function removeRow(btn) {
    if(document.querySelectorAll('.line-row').length > 1) {
        btn.closest('tr').remove();
    }
}
</script>
{% endblock %}
