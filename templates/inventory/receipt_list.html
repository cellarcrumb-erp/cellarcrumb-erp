{% extends 'base.html' %}
{% block content %}
<h2>Goods Receipts</h2>
<a href="{{ url_for('inventory.new_receipt') }}" class="btn btn-primary mb-3">New Receipt</a>
<table class="table">
    <tr><th>Ref</th><th>Date</th><th>Status</th><th>Total Value</th><th>Action</th></tr>
    {% for r in receipts %}
    <tr>
        <td>{{ r.doc_ref }}</td>
        <td>{{ r.doc_date }}</td>
        <td>{{ r.status }}</td>
        <td>{{ r.total_value }}</td>
        <td><a href="{{ url_for('inventory.receipt_detail', id=r.id) }}">View</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
