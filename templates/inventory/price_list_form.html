{% extends 'base.html' %}
{% block page_title %}{{ 'Edit' if price_list else 'New' }} Price List{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('inventory.index') }}">Inventory</a>
  <span class="breadcrumb-sep">/</span>
  <a href="{{ url_for('inventory.price_lists') }}">Price Lists</a>
  <span class="breadcrumb-sep">/</span>
  <span>{{ price_list.name if price_list else 'New' }}</span>
</div>
<div class="card form-card" style="max-width:600px;">
  <div class="card-header" style="border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:16px;">
    <h3 class="card-title">{{ 'Edit' if price_list else 'New' }} Price List</h3>
  </div>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Price List Code *</label>
        <input type="text" name="code" class="form-control font-bold" placeholder="e.g. WHOLESALE" value="{{ price_list.code if price_list else '' }}" {% if price_list %}readonly{% endif %} required>
      </div>
      <div class="form-group">
        <label class="form-label">Price List Name *</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Wholesale Tier 1" value="{{ price_list.name if price_list else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Currency</label>
        <select name="currency" class="form-control">
          {% for c in currencies %}
          <option value="{{ c.code }}" {% if price_list and price_list.currency == c.code %}selected{% elif not price_list and c.code == 'KES' %}selected{% endif %}>
            {{ c.code }} - {{ c.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-top:28px;">
        <input type="checkbox" name="is_active" id="isActive" {% if not price_list or price_list.is_active %}checked{% endif %}>
        <label for="isActive" class="form-label" style="margin:0; cursor:pointer;">Active</label>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px; display:flex; justify-content:flex-end; gap:8px;">
      <a href="{{ url_for('inventory.price_lists') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Price List</button>
    </div>
  </form>
</div>
{% endblock %}
